    Projects:
      - name: Bachelor Thesis — Linear and Nonlinear Optical Properties of Ferrite-Based Thin Films
        start_date: 2023-07
        end_date: 2024-05
        summary: >
          Investigated linear and nonlinear optical properties of monolayer and multilayer
          ferrite-based thin films and devices, with potential applications in optoelectronics.
        highlights:
