          Presented research on hybrid ZnO nanowire–WSe₂ FETs; investigated photoluminescence and
          gate-dependent optical behavior in 1D–2D heterostructures; demonstrated device fabrication,
          electrical characterization, and optical measurements for nanoscale photonic devices.

    Workshops & Summer Schools:
