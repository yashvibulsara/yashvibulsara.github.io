      - name: Laser-Induced Breakdown Spectroscopy for Trace Metals in Liquids
        start_date: 2022-01
        end_date: 2023-01
        summary: >
          Student Research Programme project (Office of Dean R&D) exploring Enhanced LIBS
          for liquid samples; team research grant of INR 75,000.
        highlights:
          - Upgraded a standard LIBS setup by adding a nebulizer for aerosol-LIBS measurements
          - Applied aerosol LIBS principles to analyze trace metals in liquid samples

    Conference Presentations:
      - label: "Mar 2026 · Dresden, Germany"
